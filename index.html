<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>☠ HOST — трюм</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060606'/%3E%3Ccircle cx='16' cy='14' r='10' fill='%23ececec'/%3E%3Ccircle cx='11.5' cy='13' r='2.6' fill='%23060606'/%3E%3Ccircle cx='20.5' cy='13' r='2.6' fill='%23060606'/%3E%3Cpath d='M13 20 L13 25 M16 20 L16 26 M19 20 L19 25' stroke='%23ececec' stroke-width='2'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=PT+Mono&display=swap');

  :root{
    --void:  #060606;
    --smoke: #131313;
    --iron:  #2b2b2b;
    --ash:   #8f8f8a;
    --bone:  #ececea;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--void);
    color:var(--bone);
    font-family:'PT Mono', ui-monospace, 'Courier New', monospace;
    min-height:100vh;
  }

  body{
    background-image:
      linear-gradient(rgba(6,6,6,0.82), rgba(6,6,6,0.9)),
      url('https://narrayt.github.io/host/sources/asdF.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }

  ::selection{ background:var(--bone); color:var(--void); }

  a{ color:var(--bone); }

  button, input{
    font-family:inherit;
    color:inherit;
    background:none;
    border:none;
  }

  .glyph{ filter:grayscale(1) contrast(1.1); }

  /* ---------- layout shells ---------- */

  #login-view{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  #login-view.hidden{ display:none; }

  #app-view{ display:none; max-width:920px; margin:0 auto; padding:28px 20px 80px; }
  #app-view.visible{ display:block; }

  /* ---------- login card ---------- */

  .poster{
    width:100%; max-width:380px;
    border:1px solid var(--iron);
    background:var(--smoke);
    padding:38px 30px 30px;
    position:relative;
    clip-path: polygon(0 0, 97% 0, 100% 3%, 100% 100%, 3% 100%, 0 96%);
  }

  .poster .skull{
    text-align:center;
    font-size:30px;
    line-height:1;
    margin-bottom:10px;
  }

  .poster h1{
    font-family:'Special Elite', 'PT Mono', monospace;
    font-weight:400;
    text-align:center;
    font-size:28px;
    letter-spacing:2px;
    margin:0 0 6px;
  }

  .poster .tagline{
    text-align:center;
    color:var(--ash);
    font-size:12.5px;
    margin:0 0 30px;
    line-height:1.5;
  }

  .field-label{
    display:block;
    font-size:12px;
    color:var(--ash);
    margin-bottom:8px;
  }

  .token-row{
    display:flex;
    border:1px solid var(--iron);
    background:var(--void);
    margin-bottom:6px;
  }

  .token-row input{
    flex:1;
    padding:11px 12px;
    font-size:13.5px;
    letter-spacing:0.5px;
  }
  .token-row input:focus{ outline:none; }

  .token-row button{
    padding:0 13px;
    color:var(--ash);
    border-left:1px solid var(--iron);
    cursor:pointer;
    font-size:13px;
  }
  .token-row button:hover{ color:var(--bone); }

  .hint{ font-size:11px; color:var(--ash); margin:0 0 22px; line-height:1.5; }

  .btn-primary{
    display:block;
    width:100%;
    padding:13px;
    border:1px solid var(--bone);
    background:var(--bone);
    color:var(--void);
    font-size:13.5px;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:background 0.15s, color 0.15s;
  }
  .btn-primary:hover{ background:var(--void); color:var(--bone); }
  .btn-primary:disabled{ opacity:0.45; cursor:default; }
  .btn-primary:disabled:hover{ background:var(--bone); color:var(--void); }

  .login-error{
    margin-top:14px;
    font-size:12px;
    color:var(--bone);
    border-left:2px solid var(--bone);
    padding:8px 10px;
    background:rgba(255,255,255,0.04);
    display:none;
  }
  .login-error.show{ display:block; }

  /* ---------- app top bar ---------- */

  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    padding-bottom:16px;
    border-bottom:1px solid var(--iron);
    margin-bottom:26px;
  }

  .topbar .brand{
    font-family:'Special Elite', monospace;
    font-size:20px;
    letter-spacing:1.5px;
  }

  .topbar .repo{
    font-size:12px;
    color:var(--ash);
  }

  .topbar .repo b{ color:var(--bone); font-weight:400; }

  .logout{
    font-size:12px;
    color:var(--ash);
    cursor:pointer;
    border:1px solid var(--iron);
    padding:6px 11px;
  }
  .logout:hover{ color:var(--bone); border-color:var(--bone); }

  /* ---------- dropzone ---------- */

  .dropzone{
    border:1px dashed var(--iron);
    padding:26px 20px;
    text-align:center;
    margin-bottom:34px;
    transition:border-color 0.15s, background 0.15s;
  }
  .dropzone.drag{ border-color:var(--bone); background:rgba(255,255,255,0.03); }

  .dropzone p{ margin:0 0 14px; font-size:13px; color:var(--ash); }

  .btn-outline{
    border:1px solid var(--iron);
    padding:9px 18px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--bone);
  }
  .btn-outline:hover{ border-color:var(--bone); }

  .status-line{
    margin-top:14px;
    font-size:12px;
    color:var(--ash);
    min-height:16px;
  }

  /* ---------- manifest ---------- */

  .manifest-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:14px;
  }

  .manifest-head h2{
    font-weight:400;
    font-size:14px;
    margin:0;
    letter-spacing:0.5px;
  }

  .manifest-head h2 span{ color:var(--ash); }

  .tabs{ display:flex; gap:2px; }
  .tabs button{
    font-size:12px;
    padding:6px 10px;
    color:var(--ash);
    cursor:pointer;
    border-bottom:1px solid transparent;
  }
  .tabs button.active{ color:var(--bone); border-bottom-color:var(--bone); }
  .tabs button:hover{ color:var(--bone); }

  .refresh{
    color:var(--ash);
    cursor:pointer;
    font-size:14px;
    padding:4px 6px;
  }
  .refresh:hover{ color:var(--bone); }

  table.ledger{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }

  table.ledger thead th{
    text-align:left;
    font-weight:400;
    color:var(--ash);
    font-size:11px;
    padding:0 8px 8px;
    border-bottom:1px solid var(--iron);
  }

  table.ledger tbody tr{
    border-bottom:1px solid var(--iron);
  }
  table.ledger tbody tr:hover{ background:rgba(255,255,255,0.025); }

  table.ledger td{
    padding:10px 8px;
    vertical-align:middle;
  }

  .col-n{ color:var(--ash); width:34px; }
  .col-thumb{ width:44px; }

  .thumb{
    width:34px; height:34px;
    border:1px solid var(--iron);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:var(--smoke);
    font-size:14px;
    color:var(--ash);
  }
  .thumb img{
    width:100%; height:100%; object-fit:cover;
  }
  .thumb.is-image{ cursor:pointer; }

  #lightbox{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    padding:40px;
    z-index:60;
  }
  #lightbox.show{ display:flex; }
  #lightbox img{
    max-width:100%;
    max-height:100%;
    border:1px solid var(--iron);
  }

  .fname{
    cursor:pointer;
    border-bottom:1px dotted var(--iron);
    word-break:break-all;
  }
  .fname:hover{ border-bottom-color:var(--bone); }

  .col-type{ color:var(--ash); width:90px; }

  .col-actions{ width:64px; text-align:right; white-space:nowrap; }
  .icon-btn{
    cursor:pointer;
    color:var(--ash);
    font-size:13px;
    padding:2px 5px;
  }
  .icon-btn:hover{ color:var(--bone); }

  .rename-input{
    border:1px solid var(--bone);
    background:var(--void);
    padding:4px 6px;
    font-size:13px;
    width:100%;
  }
  .rename-input:focus{ outline:none; }

  .audio-cell audio{
    height:26px;
    width:170px;
    filter:grayscale(1);
  }

  .empty{
    text-align:center;
    color:var(--ash);
    font-size:13px;
    padding:40px 10px;
    border:1px dashed var(--iron);
  }

  /* ---------- toast ---------- */

  #toast-stack{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:50;
  }

  .toast{
    background:var(--bone);
    color:var(--void);
    font-size:12.5px;
    padding:10px 16px;
    border:1px solid var(--bone);
    opacity:0;
    transform:translateY(6px);
    transition:opacity 0.2s, transform 0.2s;
    white-space:nowrap;
  }
  .toast.err{ background:var(--void); color:var(--bone); border-color:var(--bone); }
  .toast.show{ opacity:1; transform:translateY(0); }

  @media (max-width:620px){
    table.ledger thead{ display:none; }
    table.ledger, table.ledger tbody, table.ledger tr, table.ledger td{ display:block; width:100%; }
    table.ledger tr{ padding:10px 0; }
    table.ledger td{ padding:2px 0; border:none; }
    .col-thumb{ float:left; margin-right:10px; }
    .col-n{ display:none; }
    .col-actions{ text-align:left; margin-top:6px; }
    .audio-cell audio{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-view">
  <div class="poster">
    <div class="skull glyph">☠</div>
    <h1>HOST</h1>
    <p class="tagline">цифровой трюм для картинок,<br>музыки и прочей добычи</p>

    <label class="field-label" for="token-input">Токен доступа</label>
    <div class="token-row">
      <input id="token-input" type="password" placeholder="ghp_&hellip;" autocomplete="off" spellcheck="false">
      <button id="toggle-token" type="button" title="показать/скрыть">•••</button>
    </div>
    <button id="enter-btn" class="btn-primary" style="margin-top:22px;">Отпереть трюм</button>
    <div id="login-error" class="login-error">Не вышло. Проверь токен и доступ к репозиторию.</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-view">
  <div class="topbar">
    <div class="brand glyph">☠ HOST</div>
    <div class="logout" id="logout-btn">выйти</div>
  </div>

  <div class="dropzone" id="dropzone">
    <p>перетащи файлы сюда, или</p>
    <button class="btn-outline" id="pick-btn" type="button">выбрать файлы</button>
    <input type="file" id="file-input" multiple style="display:none">
    <div class="status-line" id="status-line"></div>
  </div>

  <div class="manifest-head">
    <h2>Манифест <span id="manifest-count">(0)</span></h2>
    <div class="tabs" id="tabs">
      <button data-filter="all" class="active">все</button>
      <button data-filter="image">картинки</button>
      <button data-filter="audio">музыка</button>
      <button data-filter="other">прочее</button>
    </div>
    <span class="refresh" id="refresh-btn" title="обновить">⟳</span>
  </div>

  <div id="manifest-wrap"></div>
</div>

<div id="toast-stack"></div>
<div id="lightbox"><img id="lightbox-img" src="" alt=""></div>

<script>
(function(){

  /* ---------- repo autodetection ---------- */
  function detectRepo(){
    const host = location.hostname;
    const m = host.match(/^([^.]+)\.github\.io$/i);
    const owner = m ? m[1] : host.split('.')[0];
    const segs = location.pathname.split('/').filter(Boolean);
    const repo = segs.length ? segs[0] : (owner + '.github.io');
    return { owner, repo };
  }
  const REPO = detectRepo();
  const API = 'https://api.github.com';

  let TOKEN = sessionStorage.getItem('host_token') || '';
  let FILES = [];
  let FILTER = 'all';

  const IMAGE_EXT = new Set(['png','jpg','jpeg','gif','webp','svg','bmp','ico','avif']);
  const AUDIO_EXT = new Set(['mp3','wav','ogg','flac','m4a','aac','wma','opus']);

  function ext(name){
    const i = name.lastIndexOf('.');
    return i > -1 ? name.slice(i+1).toLowerCase() : '';
  }
  function category(name){
    const e = ext(name);
    if (IMAGE_EXT.has(e)) return 'image';
    if (AUDIO_EXT.has(e)) return 'audio';
    return 'other';
  }
  function categoryLabel(cat){
    return cat === 'image' ? 'картинка' : cat === 'audio' ? 'музыка' : 'файл';
  }

  /* ---------- dom refs ---------- */
  const loginView   = document.getElementById('login-view');
  const appView     = document.getElementById('app-view');
  const tokenInput  = document.getElementById('token-input');
  const toggleToken = document.getElementById('toggle-token');
  const enterBtn    = document.getElementById('enter-btn');
  const loginError  = document.getElementById('login-error');
  const logoutBtn   = document.getElementById('logout-btn');
  const dropzone    = document.getElementById('dropzone');
  const pickBtn     = document.getElementById('pick-btn');
  const fileInput   = document.getElementById('file-input');
  const statusLine  = document.getElementById('status-line');
  const manifestWrap  = document.getElementById('manifest-wrap');
  const manifestCount = document.getElementById('manifest-count');
  const tabsEl      = document.getElementById('tabs');
  const refreshBtn  = document.getElementById('refresh-btn');
  const toastStack  = document.getElementById('toast-stack');


  /* ---------- toast ---------- */
  function toast(msg, isErr){
    const el = document.createElement('div');
    el.className = 'toast' + (isErr ? ' err' : '');
    el.textContent = msg;
    toastStack.appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    setTimeout(()=>{
      el.classList.remove('show');
      setTimeout(()=> el.remove(), 250);
    }, 2600);
  }

  function setStatus(text){ statusLine.textContent = text || ''; }

  /* ---------- github api helper ---------- */
  async function gh(path, opts){
    opts = opts || {};
    const headers = Object.assign({
      'Authorization': 'token ' + TOKEN,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }, opts.headers || {});
    return fetch(API + path, Object.assign({}, opts, { headers }));
  }

  function contentsUrl(name){
    return '/repos/' + REPO.owner + '/' + REPO.repo + '/contents/sources/' + encodeURIComponent(name);
  }

  /* ---------- auth flow ---------- */
  async function verifyToken(t){
    const res = await gh('/repos/' + REPO.owner + '/' + REPO.repo, {});
    return res.ok;
  }

  async function login(){
    const t = tokenInput.value.trim();
    if (!t) return;
    TOKEN = t;
    enterBtn.disabled = true;
    enterBtn.textContent = 'Пришвартовываемся…';
    loginError.classList.remove('show');
    try{
      const ok = await verifyToken(t);
      if (!ok) throw new Error('bad-auth');
      sessionStorage.setItem('host_token', TOKEN);
      showApp();
      await loadManifest();
    }catch(e){
      TOKEN = '';
      loginError.classList.add('show');
    }finally{
      enterBtn.disabled = false;
      enterBtn.textContent = 'Отпереть трюм';
    }
  }

  function logout(){
    TOKEN = '';
    sessionStorage.removeItem('host_token');
    FILES = [];
    appView.classList.remove('visible');
    loginView.classList.remove('hidden');
    tokenInput.value = '';
  }

  function showApp(){
    loginView.classList.add('hidden');
    appView.classList.add('visible');
  }

  /* ---------- manifest ---------- */
  async function loadManifest(){
    setStatus('Сверяем груз…');
    try{
      const res = await gh('/repos/' + REPO.owner + '/' + REPO.repo + '/contents/sources', {});
      if (res.status === 404){
        FILES = [];
      } else if (res.ok){
        const data = await res.json();
        FILES = (Array.isArray(data) ? data : [])
          .filter(function(i){ return i.type === 'file'; })
          .map(function(i){ return { name:i.name, path:i.path, sha:i.sha, size:i.size, download_url:i.download_url }; })
          .sort(function(a,b){ return a.name.localeCompare(b.name); });
      } else {
        throw new Error('list-failed');
      }
      render();
    }catch(e){
      toast('Не удалось прочитать трюм.', true);
    }finally{
      setStatus('');
    }
  }

  function pageUrl(name){
    return 'https://' + REPO.owner + '.github.io/' + REPO.repo + '/sources/' + encodeURIComponent(name);
  }

  async function copyName(name){
    try{
      await navigator.clipboard.writeText(pageUrl(name));
      toast('Ссылка скопирована.');
    }catch(e){
      toast('Не удалось скопировать.', true);
    }
  }

  /* ---------- render ---------- */
  function render(){
    manifestCount.textContent = '(' + FILES.length + ')';

    const visible = FILTER === 'all' ? FILES : FILES.filter(function(f){ return category(f.name) === FILTER; });

    if (FILES.length === 0){
      manifestWrap.innerHTML = '<div class="empty">Трюм пуст. Пора обзавестись добычей.</div>';
      return;
    }
    if (visible.length === 0){
      manifestWrap.innerHTML = '<div class="empty">Ничего подходящего в трюме.</div>';
      return;
    }

    let rows = '';
    visible.forEach(function(f, idx){
      const cat = category(f.name);
      let thumb;
      if (cat === 'image'){
        thumb = '<div class="thumb is-image" data-act="preview" data-url="' + f.download_url + '"><img src="' + f.download_url + '" loading="lazy" alt=""></div>';
      } else if (cat === 'audio'){
        thumb = '<div class="thumb glyph">♪</div>';
      } else {
        thumb = '<div class="thumb glyph">▤</div>';
      }

      const num = String(idx+1).padStart(2,'0');

      rows += '' +
        '<tr data-name="' + escapeAttr(f.name) + '">' +
          '<td class="col-n">' + num + '</td>' +
          '<td class="col-thumb">' + thumb + '</td>' +
          '<td class="col-name">' +
            (cat === 'audio'
              ? ('<div class="fname" data-act="copy">' + escapeHtml(f.name) + '</div>' +
                 '<div class="audio-cell"><audio controls preload="none" src="' + f.download_url + '"></audio></div>')
              : ('<span class="fname" data-act="copy">' + escapeHtml(f.name) + '</span>')
            ) +
          '</td>' +
          '<td class="col-type">' + categoryLabel(cat) + '</td>' +
          '<td class="col-actions">' +
            '<span class="icon-btn" data-act="rename" title="переименовать">✎</span>' +
            '<span class="icon-btn" data-act="delete" title="выбросить">✕</span>' +
          '</td>' +
        '</tr>';
    });

    manifestWrap.innerHTML =
      '<table class="ledger"><thead><tr>' +
        '<th class="col-n">№</th><th class="col-thumb"></th><th>имя</th><th class="col-type">тип</th><th class="col-actions"></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  manifestWrap.addEventListener('click', function(e){
    const target = e.target.closest('[data-act]');
    if (!target) return;
    const act = target.getAttribute('data-act');
    if (act === 'preview'){
      openLightbox(target.getAttribute('data-url'));
      return;
    }
    const row = target.closest('tr');
    const name = row.getAttribute('data-name');
    if (act === 'copy') copyName(name);
    if (act === 'delete') deleteFile(name);
    if (act === 'rename') startRename(row, name);
  });

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  function openLightbox(url){
    lightboxImg.src = url;
    lightbox.classList.add('show');
  }
  function closeLightbox(){
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  }
  lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeLightbox();
  });

  tabsEl.addEventListener('click', function(e){
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    FILTER = btn.getAttribute('data-filter');
    Array.from(tabsEl.querySelectorAll('button')).forEach(function(b){ b.classList.toggle('active', b === btn); });
    render();
  });

  refreshBtn.addEventListener('click', loadManifest);

  /* ---------- rename ---------- */
  function startRename(row, oldName){
    const cell = row.querySelector('.col-name');
    const current = cell.querySelector('.fname');
    if (!current) return;
    const input = document.createElement('input');
    input.className = 'rename-input';
    input.value = oldName;
    current.replaceWith(input);
    input.focus();
    input.select();

    let done = false;
    function commit(){
      if (done) return; done = true;
      const val = input.value.trim();
      if (val && val !== oldName) renameFile(oldName, val);
      else render();
    }
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape'){ done = true; render(); }
    });
    input.addEventListener('blur', commit);
  }

  function sanitizeName(name){
    return name.trim().replace(/\s+/g, '_');
  }

  async function getFileContent(path, sha){
    const res = await gh('/repos/' + REPO.owner + '/' + REPO.repo + '/contents/' + path, {});
    if (res.ok){
      const data = await res.json();
      if (data.content) return data.content.replace(/\n/g, '');
    }
    const blobRes = await gh('/repos/' + REPO.owner + '/' + REPO.repo + '/git/blobs/' + sha, {});
    if (!blobRes.ok) throw new Error('blob-fetch-failed');
    const blob = await blobRes.json();
    return blob.content.replace(/\n/g, '');
  }

  async function renameFile(oldName, newNameRaw){
    const newName = sanitizeName(newNameRaw);
    if (!newName || newName === oldName){ render(); return; }
    const old = FILES.find(function(f){ return f.name === oldName; });
    if (!old) return;

    setStatus('Переносим груз…');
    try{
      const content = await getFileContent(old.path, old.sha);
      const target = FILES.find(function(f){ return f.name === newName; });
      const putBody = { message: 'переименовано: ' + oldName + ' \u2192 ' + newName, content: content };
      if (target) putBody.sha = target.sha;

      const putRes = await gh(contentsUrl(newName), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(putBody)
      });
      if (!putRes.ok) throw new Error('rename-create-failed');

      const delRes = await gh(contentsUrl(oldName), {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'удалено старое имя: ' + oldName, sha: old.sha })
      });
      if (!delRes.ok) throw new Error('rename-delete-failed');

      await loadManifest();
      toast('Переименовано.');
    }catch(e){
      toast('Не вышло переименовать.', true);
      render();
    }finally{
      setStatus('');
    }
  }

  /* ---------- delete ---------- */
  async function deleteFile(name){
    const f = FILES.find(function(x){ return x.name === name; });
    if (!f) return;
    if (!confirm('Выбросить «' + name + '» за борт?')) return;
    setStatus('Выбрасываем за борт…');
    try{
      const res = await gh(contentsUrl(name), {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'удалено: ' + name, sha: f.sha })
      });
      if (!res.ok) throw new Error('delete-failed');
      await loadManifest();
      toast('Выброшено за борт.');
    }catch(e){
      toast('Не вышло выбросить файл.', true);
    }finally{
      setStatus('');
    }
  }

  /* ---------- upload ---------- */
  async function readBase64(file){
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let binary = '';
    const chunk = 0x8000;
    for (let i=0; i<bytes.length; i+=chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
    }
    return btoa(binary);
  }

  async function uploadOne(file){
    const name = sanitizeName(file.name);
    const content = await readBase64(file);
    const existing = FILES.find(function(f){ return f.name === name; });
    const body = { message: 'добавлено: ' + name, content: content };
    if (existing) body.sha = existing.sha;
    const res = await gh(contentsUrl(name), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('upload-failed: ' + name);
  }

  async function uploadFiles(fileList){
    const files = Array.from(fileList);
    if (!files.length) return;
    let okCount = 0;
    for (let i=0; i<files.length; i++){
      setStatus('Груз поднимается на борт… (' + (i+1) + '/' + files.length + ')');
      try{
        await uploadOne(files[i]);
        okCount++;
      }catch(e){
        toast('Не вышло загрузить «' + files[i].name + '».', true);
      }
    }
    setStatus('');
    await loadManifest();
    if (okCount) toast(okCount > 1 ? 'Груз закреплён (' + okCount + ').' : 'Груз закреплён.');
  }

  pickBtn.addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    uploadFiles(fileInput.files);
    fileInput.value = '';
  });

  ['dragenter','dragover'].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('drag');
    });
  });
  ['dragleave','drop'].forEach(function(evt){
    dropzone.addEventListener(evt, function(e){
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', function(e){
    if (e.dataTransfer && e.dataTransfer.files) uploadFiles(e.dataTransfer.files);
  });

  /* ---------- misc ui ---------- */
  toggleToken.addEventListener('click', function(){
    tokenInput.type = tokenInput.type === 'password' ? 'text' : 'password';
  });
  enterBtn.addEventListener('click', login);
  tokenInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') login(); });
  logoutBtn.addEventListener('click', logout);

  /* ---------- init ---------- */
  (async function init(){
    if (TOKEN){
      showApp();
      try{
        const ok = await verifyToken(TOKEN);
        if (!ok) throw new Error('stale-token');
        await loadManifest();
      }catch(e){
        logout();
      }
    }
  })();

})();
</script>
</body>
</html>
